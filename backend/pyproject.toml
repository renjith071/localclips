[project]
name = "localclips-backend"
version = "0.1.0"
description = "LocalClips - Clip generation from local video + SRT + AI JSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.6.5",
    "python-multipart>=0.0.9",
    "srt>=3.5.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["localclips_app*"]
